<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoothera</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
        }

        .hero {
            position: relative;
            height: 100vh;
            overflow: hidden;
        }

        /* GAMBAR BACKGROUND */
        .hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background: url("Pict/beautiful-shot-forest-with-tall-trees-bright-sun-rays-shining.jpg") center/cover no-repeat;
            z-index: 1;
        }

        /* OVERLAY GRADIENT HIJAU */
        .hero::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(26, 26, 26, 0.95),  
                rgba(26, 26, 26, 0.7),
                rgba(26, 26, 26, 0.4),
                rgba(26, 26, 26, 0.2),
                rgba(26, 26, 26, 0)      
            );
            z-index: 2;
        }

        /* KONTEN DI ATAS */
        .hero-content {
            position: relative;
            z-index: 3;
            color: white;
            max-width: 600px;
            padding: 100px 50px;
        }

        .hero-content {
            margin: 0 auto;
            font-size: 80px;
            font-weight: 1000;
        }

        .hero-content p {
            font-size: 18px;
            font-weight: bold;
        }

        .navbar {
            position: relative;
            z-index: 3;
        }
        .navbar-toggler-icon {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='white' stroke-linecap='round' stroke-miterlimit='10' stroke-width='3.5' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
        }

        .navbar-toggler {
            border: none;
            color: white;
            box-shadow: none;
            margin-right: 20px;
        }

        .navbar-brand img {
            width: 85px;
            height: auto;
            margin-left: 15px;
        }

        .brand-name {
            color: white;
            font-size: 35px;
            font-weight: 700;
            margin-left: 10px;
        }
        .nav-link {
            color: white;
        }

        .nav-link:hover {
            color: gold;
        }

        .dropdown-menu {
            background-color: #fff8dd;
        }

        .dropdown-item {
            font-weight: bold;
            color: #1a1a1a;
        }

        .dropdown-item:hover {
            color: gold;
        }

        .custom-menu {
            background-color: #1a1a1a ;
            color: white;
        }

        .navbar-nav {
            position: absolute;
            top: 40px;
        }

        .offcanvas.body {
            background: transparent;
        }

        .custom-close {
            position: absolute;
            top: 5px;
            right: 15px;
            font-size: 28px;
            background: transparent;
            border: none;
            color: white;
            z-index: 99999;
        }
    </style>
</head>
<body>
    <div class="hero">
        <nav class="navbar navbar-light">
            <div class="d-flex align-items-center w-100">
                <a class="navbar-brand" href="Zoothera.html"><img src="Pict/Logo ZooThera.png"></a>

                <div class="brand-name">ZOOTHERA</div>

                <!-- Burger button -->
                <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="offcanvas" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Menu -->
                <div class="offcanvas offcanvas-end custom-menu" tabindex="-1" id="navbarNav">
                    <button type="button" data-bs-dismiss="offcanvas" class="custom-close">
                        ✕
                    </button>
                    <div class="offcanvas-body d-flex">
                        <div class="menu-left">
                            <ul class="navbar-nav ms-auto">
                                <!--<li class="nav-item">
                                    <a class="nav-link active" href="#">Home</a>
                                </li>--> <!--INI UNTUK TOMBOL HOME-->

                                <li class="nav-item">
                                    <a class="nav-link" href="AboutZooThera.html">About Zoothera</a>
                                </li>

                                <li>
                                    <a class="nav-link" href="Structure_Zoothera.html">Zoothera Group Structure</a>
                                </li>
                                
                                <li class="nav-item dropdown">
                                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Impact Report</a>
                                    <ul class="dropdown-menu">
                                        <li><a class="dropdown-item" href="#">Conservation Map</a></li>
                                        <li><a class="dropdown-item" href="#">Humanely Raised Company</a></li>
                                        <li><a class="dropdown-item" href="#">Company Operational Map</a></li>
                                    </ul>
                                </li>
                            </ul>
                        </div>    
                    </div>    
                </div>
            </div>
        </nav>

        <div class="hero-content">
            <h1>ZOOTHERA</h1>
            <p>lorem ipsum</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
